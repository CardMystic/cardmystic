name: E2E Tests

# `on` is quoted to avoid YAML 1.1 boolean coercion (`on` -> true) that
# some YAML linters (incl. VS Code's built-in) flag as invalid.
#
# Unit and gateway checks run for pushes and PRs to dev/main.
# Browser E2E runs only on main pushes or a manual run selected on main.
'on':
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

# Cancel superseded runs within one branch or PR. A merged PR can report its
# base branch as github.ref, so identify PRs by number to protect main validation.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore last validated sitemap build data
        uses: actions/cache@v4
        with:
          path: .cache/sitemap
          key: sitemap-data-${{ runner.os }}-unit-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sitemap-data-${{ runner.os }}-
      - name: Run unit tests
        run: pnpm test
      - name: Check Azure gateway responses
        run: pnpm test:azure-gateway

  e2e:
    name: Playwright (${{ matrix.project }})
    needs: unit
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Browser dependency installation and the full single-worker suite share this limit.
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        project: [chromium]

    env:
      # Main-only browser integration checks use the production services.
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL || 'https://ddbgietanhxrozzmogur.supabase.co' }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY || 'test-anon-key' }}
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NUXT_PUBLIC_RECAPTCHA_SITE_KEY || 'test-recaptcha-site-key' }}
      NUXT_BACKEND_URL: https://api.cardmystic.com
      # Private service credential for the frontend test server only.
      NUXT_BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY_PRODUCTION }}
      # Real Supabase test user used by login / logout integration tests.
      # Tests that need these will skip cleanly if either is unset.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Bypass token for the backend's IP rate limit (60 req/min).
      # The backend allowlists requests carrying
      # `X-CardMystic-Test: $E2E_BYPASS_TOKEN`.
      E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Restore last validated sitemap build data
        uses: actions/cache@v4
        with:
          path: .cache/sitemap
          key: sitemap-data-${{ runner.os }}-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sitemap-data-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.project }}

      - name: Wake backend (avoid cold-start stalls in tests)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 -o /dev/null "$NUXT_BACKEND_URL/" 2>/dev/null; then
              echo "Backend responded on attempt $i"
              break
            fi
            echo "Backend not ready (attempt $i), retrying..."
            sleep 5
          done
        continue-on-error: true

      - name: Build Nuxt app
        run: pnpm build

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
