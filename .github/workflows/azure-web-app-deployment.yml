name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Restore last validated sitemap build data
        uses: actions/cache@v4
        with:
          path: .cache/sitemap
          key: sitemap-data-${{ runner.os }}-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sitemap-data-${{ runner.os }}-
      - name: Build And Deploy (Production)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_TREE_0194D6F0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/' # App source code path
          api_location: '.output/server' # Api source code path - optional
          output_location: '.output/public' # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NUXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          # Call the Azure origin directly to avoid a second Cloudflare hop.
          NUXT_BACKEND_URL: https://cardmystic-backend-fbhtc0h2gzdfdhcs.eastus-01.azurewebsites.net
          NUXT_BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY_PRODUCTION }}
          NUXT_FRONTEND_URL: https://cardmystic.com
          NUXT_PUBLIC_MAINTENANCE_MODE: ${{ vars.NUXT_PUBLIC_MAINTENANCE_MODE || 'false' }}
